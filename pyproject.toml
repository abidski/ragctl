[project]
name = "ragctl"
version = "0.1.0"
description = "A terminal RAG application for querying your local documents"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-anthropic",
    "langchain-groq",
    "langchain-ollama",
    "sentence-transformers",
    "pypdf",
    "python-dotenv",
    "textual",
    "tqdm",
]

[project.scripts]
ragctl = "ragctl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
